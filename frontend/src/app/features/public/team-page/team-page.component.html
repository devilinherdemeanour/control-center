<section class="page">
  <header class="page-header">
    <p class="eyebrow">Komanda</p>
    <h1>Peşəkar hüquqşünaslarımız</h1>
    <p class="lead">Təcrübəli komandamız hər mərhələdə yanınızdadır.</p>
  </header>

  <p *ngIf="loading" class="status">Yüklənir...</p>

  <div class="grid" *ngIf="!loading">
    <a *ngFor="let lawyer of lawyers" [routerLink]="['/komanda', lawyer.id]" class="card">
      <img [src]="lawyer.photo" [alt]="lawyer.firstName + ' ' + lawyer.lastName" loading="lazy" />
      <div class="card-body">
        <h2>{{ lawyer.firstName }} {{ lawyer.lastName }}</h2>
        <p class="role">{{ lawyer.title }}</p>
        <p class="direction">{{ lawyer.direction }}</p>
        <p class="bio">{{ lawyer.bio }}</p>
      </div>
    </a>
  </div>
</section>
