<div class="page">
  <div class="page-head">
    <div>
      <h2>{{ isEdit ? 'Edit blog' : 'New blog' }}</h2>
      <p>Posts are written to <code>backend/data/blogs.json</code>.</p>
    </div>
    <div class="head-actions">
      <a class="btn ghost" routerLink="/admin/blogs">Back</a>
      <button
        id="blog-submit"
        class="btn primary"
        type="button"
        (click)="submit($event)"
        [disabled]="saving"
      >
        {{ saving ? 'Saving…' : isEdit ? 'Update blog' : 'Create blog' }}
      </button>
    </div>
  </div>

  <div class="state" *ngIf="loading">Loading blog…</div>
  <div class="state error" *ngIf="error">{{ error }}</div>
  <div class="state success" *ngIf="success">{{ success }}</div>

  <form class="panel form" [formGroup]="form" (ngSubmit)="submit($event)" *ngIf="!loading">
    <div class="status-field">
      <span class="status-label">Status</span>
      <div class="status-toggle" role="group" aria-label="Publication status">
        <button
          type="button"
          class="status-btn"
          [class.active]="form.value.status === 'draft'"
          (click)="setStatus('draft')"
        >
          Draft
        </button>
        <button
          type="button"
          id="status-published"
          class="status-btn"
          [class.active]="form.value.status === 'published'"
          (click)="setStatus('published')"
        >
          Published
        </button>
      </div>
    </div>

    <label [class.invalid]="submitted && form.controls.title.invalid">
      <span>Title *</span>
      <input id="blog-title" formControlName="title" placeholder="Post title" />
      <small *ngIf="submitted && form.controls.title.invalid">Title is required.</small>
    </label>

    <div class="grid two">
      <label>
        <span>Slug</span>
        <input id="blog-slug" formControlName="slug" placeholder="auto-from-title" />
      </label>
      <label>
        <span>Author</span>
        <input id="blog-author" formControlName="author" />
      </label>
    </div>

    <label>
      <span>Tags</span>
      <input id="blog-tags" formControlName="tags" placeholder="news, product, launch" />
    </label>

    <label>
      <span>Cover image URL</span>
      <input id="blog-cover" formControlName="coverImage" placeholder="https://…" />
    </label>

    <label>
      <span>Excerpt</span>
      <textarea id="blog-excerpt" formControlName="excerpt" rows="2"></textarea>
    </label>

    <div class="editor-field" [class.invalid]="submitted && form.controls.content.invalid">
      <span>Content *</span>
      <angular-editor
        id="blog-content"
        formControlName="content"
        [config]="editorConfig"
        placeholder="Blog məzmununu yazın…"
      ></angular-editor>
      <small *ngIf="submitted && form.controls.content.invalid">Content is required.</small>
    </div>

    <div class="actions">
      <button
        id="blog-submit-bottom"
        class="btn primary"
        type="button"
        (click)="submit($event)"
        [disabled]="saving"
      >
        {{ saving ? 'Saving…' : isEdit ? 'Update blog' : 'Create blog' }}
      </button>
      <span class="inline-msg error" *ngIf="error">{{ error }}</span>
      <span class="inline-msg success" *ngIf="success">{{ success }}</span>
    </div>
  </form>
</div>
