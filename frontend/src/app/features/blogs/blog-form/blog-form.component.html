<div class="page">
  <div class="page-head">
    <div>
      <h2>{{ isEdit ? 'Edit blog' : 'New blog' }}</h2>
      <p>Posts are written to <code>backend/data/blogs.json</code>.</p>
    </div>
    <a class="btn ghost" routerLink="/blogs">Back</a>
  </div>

  <div class="state" *ngIf="loading">Loading blog…</div>
  <div class="state error" *ngIf="error">{{ error }}</div>
  <div class="state success" *ngIf="success">{{ success }}</div>

  <form class="panel form" [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loading">
    <label>
      <span>Title</span>
      <input formControlName="title" placeholder="Post title" />
    </label>

    <div class="grid two">
      <label>
        <span>Slug</span>
        <input formControlName="slug" placeholder="auto-from-title" />
      </label>
      <label>
        <span>Status</span>
        <select formControlName="status">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>
      </label>
    </div>

    <div class="grid two">
      <label>
        <span>Author</span>
        <input formControlName="author" />
      </label>
      <label>
        <span>Tags</span>
        <input formControlName="tags" placeholder="news, product, launch" />
      </label>
    </div>

    <label>
      <span>Cover image URL</span>
      <input formControlName="coverImage" placeholder="https://…" />
    </label>

    <label>
      <span>Excerpt</span>
      <textarea formControlName="excerpt" rows="3"></textarea>
    </label>

    <label>
      <span>Content</span>
      <textarea formControlName="content" rows="12"></textarea>
    </label>

    <div class="actions">
      <button class="btn primary" type="submit" [disabled]="saving">
        {{ saving ? 'Saving…' : isEdit ? 'Update blog' : 'Create blog' }}
      </button>
    </div>
  </form>
</div>
