<div class="page">
  <div class="page-head">
    <div>
      <h2>About page</h2>
      <p>Edit the public about story, mission, and team intro.</p>
    </div>
    <div class="head-actions">
      <button
        id="about-submit"
        class="btn primary"
        type="button"
        (click)="submit()"
        [disabled]="saving || loading"
      >
        {{ saving ? 'Saving…' : 'Save about page' }}
      </button>
    </div>
  </div>

  <div class="state" *ngIf="loading">Loading about content…</div>
  <div class="state error" *ngIf="error">{{ error }}</div>
  <div class="state success" *ngIf="success" #feedback>{{ success }}</div>

  <form class="panel form" [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loading">
    <label>
      <span>Headline</span>
      <input id="about-headline" formControlName="headline" />
    </label>
    <label>
      <span>Subheadline</span>
      <input formControlName="subheadline" />
    </label>
    <div class="editor-field">
      <span>Body</span>
      <angular-editor
        id="about-body"
        formControlName="body"
        [config]="editorConfig"
        placeholder="Haqqımızda mətn…"
      ></angular-editor>
    </div>
    <div class="grid two">
      <div class="editor-field">
        <span>Mission</span>
        <angular-editor
          id="about-mission"
          formControlName="mission"
          [config]="compactEditorConfig"
        ></angular-editor>
      </div>
      <div class="editor-field">
        <span>Vision</span>
        <angular-editor
          id="about-vision"
          formControlName="vision"
          [config]="compactEditorConfig"
        ></angular-editor>
      </div>
    </div>
    <div class="editor-field">
      <span>Team intro</span>
      <angular-editor
        id="about-team"
        formControlName="teamIntro"
        [config]="compactEditorConfig"
      ></angular-editor>
    </div>

    <div class="actions">
      <button
        id="about-submit-bottom"
        class="btn primary"
        type="button"
        (click)="submit()"
        [disabled]="saving"
      >
        {{ saving ? 'Saving…' : 'Save about page' }}
      </button>
      <span class="inline-msg success" *ngIf="success">{{ success }}</span>
      <span class="inline-msg error" *ngIf="error">{{ error }}</span>
    </div>
  </form>
</div>
