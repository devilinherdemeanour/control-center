<div class="page">
  <div class="page-head">
    <div>
      <h2>About page</h2>
      <p>Edit the public about story, mission, and team intro.</p>
    </div>
    <div class="head-actions">
      <button
        id="about-submit"
        class="btn primary"
        type="button"
        (click)="submit()"
        [disabled]="saving || loading"
      >
        {{ saving ? 'Saving…' : 'Save about page' }}
      </button>
    </div>
  </div>

  <div class="state" *ngIf="loading">Loading about content…</div>
  <div class="state error" *ngIf="error">{{ error }}</div>
  <div class="state success" *ngIf="success" #feedback>{{ success }}</div>

  <form class="panel form" [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loading">
    <label>
      <span>Headline</span>
      <input id="about-headline" formControlName="headline" />
    </label>
    <label>
      <span>Subheadline</span>
      <input formControlName="subheadline" />
    </label>
    <label>
      <span>Body</span>
      <textarea formControlName="body" rows="6"></textarea>
    </label>
    <div class="grid two">
      <label>
        <span>Mission</span>
        <textarea formControlName="mission" rows="3"></textarea>
      </label>
      <label>
        <span>Vision</span>
        <textarea formControlName="vision" rows="3"></textarea>
      </label>
    </div>
    <label>
      <span>Team intro</span>
      <textarea formControlName="teamIntro" rows="3"></textarea>
    </label>

    <div class="actions">
      <button
        id="about-submit-bottom"
        class="btn primary"
        type="button"
        (click)="submit()"
        [disabled]="saving"
      >
        {{ saving ? 'Saving…' : 'Save about page' }}
      </button>
      <span class="inline-msg success" *ngIf="success">{{ success }}</span>
      <span class="inline-msg error" *ngIf="error">{{ error }}</span>
    </div>
  </form>
</div>
