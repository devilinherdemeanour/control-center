<div class="page">
  <div class="page-head">
    <div>
      <h2>About page</h2>
      <p>Edit the public about story, mission, and team intro.</p>
    </div>
  </div>

  <div class="state" *ngIf="loading">Loading about content…</div>
  <div class="state error" *ngIf="error">{{ error }}</div>
  <div class="state success" *ngIf="success">{{ success }}</div>

  <form class="panel form" [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loading">
    <label>
      <span>Headline</span>
      <input formControlName="headline" />
    </label>
    <label>
      <span>Subheadline</span>
      <input formControlName="subheadline" />
    </label>
    <label>
      <span>Body</span>
      <textarea formControlName="body" rows="8"></textarea>
    </label>
    <div class="grid two">
      <label>
        <span>Mission</span>
        <textarea formControlName="mission" rows="4"></textarea>
      </label>
      <label>
        <span>Vision</span>
        <textarea formControlName="vision" rows="4"></textarea>
      </label>
    </div>
    <label>
      <span>Team intro</span>
      <textarea formControlName="teamIntro" rows="4"></textarea>
    </label>
    <button class="btn primary" type="submit" [disabled]="saving">
      {{ saving ? 'Saving…' : 'Save about page' }}
    </button>
  </form>
</div>
