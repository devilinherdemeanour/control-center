<div class="shell" [class.nav-open]="navOpen">
  <aside class="sidebar">
    <div class="brand">
      <img
        class="brand-logo"
        src="assets/brand/logo-256.png"
        width="44"
        height="44"
        alt="Aslan Ismayilov and Partners"
      />
      <div>
        <p class="brand-name">Aslan İsmayılov</p>
        <p class="brand-sub">Admin panel</p>
      </div>
    </div>

    <nav>
      <a
        *ngFor="let link of links"
        [routerLink]="link.path"
        routerLinkActive="active"
        (click)="closeNav()"
      >
        <span class="label">{{ link.label }}</span>
        <span class="hint">{{ link.hint }}</span>
      </a>
    </nav>

    <button type="button" class="logout-btn" (click)="logout()">Çıxış</button>

    <p class="storage-note">Data stored in JSON files</p>
  </aside>

  <div class="main">
    <header class="topbar">
      <button type="button" class="menu-btn" (click)="toggleNav()" aria-label="Toggle navigation">
        Menu
      </button>
      <div>
        <p class="eyebrow">İdarə paneli</p>
        <h1>Kontent idarəsi</h1>
      </div>
      <button type="button" class="logout-btn top" (click)="logout()">Çıxış</button>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <div class="backdrop" *ngIf="navOpen" (click)="closeNav()"></div>
</div>
